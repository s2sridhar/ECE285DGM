[project]
name = "ece285"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "pytorch-ignite>=0.5.5",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F401"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["hw1", "scripts", "final_project"]
exclude = ["**/.venv", "**/data", "**/.ipynb_checkpoints"]
